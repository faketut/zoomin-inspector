services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    # Models ship in the image (models/). To serve the bottle NormalityScorer
    # instead of the default CoarseScorer, set:
    #   ZOOMIN_MODEL=models/bottle_normality.npz
    # A set-but-missing path is a startup error, not a silent fallback.

  ui:
    build: .
    command: ["python", "-m", "app.ui", "--server-name", "0.0.0.0"]
    ports:
      - "7860:7860"
    volumes:
      - ./data:/app/data
